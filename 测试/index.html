<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>死亡战壕 2D - 网页测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 2.2em;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .test-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        .test-card:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }
        .test-card h2 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .test-card h2 .icon { font-size: 1.3em; }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            margin: 5px 5px 5px 0;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4); }
        .btn-success { background: linear-gradient(135deg, #00ff88, #00cc66); }
        .btn-warning { background: linear-gradient(135deg, #ffaa00, #ff8800); }
        .btn-danger { background: linear-gradient(135deg, #ff4444, #cc0000); }
        .result-area {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 12px;
            margin-top: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85em;
            min-height: 60px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status-pass { color: #00ff88; }
        .status-fail { color: #ff4444; }
        .status-info { color: #00d4ff; }
        .status-warn { color: #ffaa00; }
        .version-info {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .version-info table { width: 100%; border-collapse: collapse; }
        .version-info td { padding: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .version-info td:first-child { color: #888; text-align: right; width: 40%; }
        .version-info td:last-child { color: #00d4ff; text-align: left; }
        .quick-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .quick-links a {
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.4);
            color: #00d4ff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1em;
        }
        .quick-links a:hover {
            background: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>死亡战壕 2D - 网页测试中心</h1>
        <p class="subtitle">用于测试游戏各项功能和服务器连通性</p>

        <div class="version-info">
            <table>
                <tr><td>测试时间：</td><td id="testTime">-</td></tr>
                <tr><td>浏览器：</td><td id="browserInfo">-</td></tr>
                <tr><td>屏幕分辨率：</td><td id="screenInfo">-</td></tr>
                <tr><td>本地存储可用：</td><td id="lsStatus">-</td></tr>
            </table>
        </div>

        <div class="quick-links">
            <a href="http://localhost:8080" target="_blank">普通版（8080）</a>
            <a href="http://localhost:3030" target="_blank">开发版（3030）</a>
            <a href="../网页/tools/index.html" target="_blank">编辑器工具</a>
            <a href="../网页/tools/lottery-editor.html" target="_blank">抽奖编辑器</a>
        </div>

        <div class="test-grid">
            <!-- 服务器连通性测试 -->
            <div class="test-card">
                <h2><span class="icon">🔌</span> 服务器连通性测试</h2>
                <button class="btn" onclick="testServer(8080)">测试普通版（8080）</button>
                <button class="btn" onclick="testServer(3030)">测试开发版（3030）</button>
                <button class="btn btn-success" onclick="testAllServers()">测试全部</button>
                <div class="result-area" id="serverResult">点击按钮开始测试...</div>
            </div>

            <!-- 存档数据测试 -->
            <div class="test-card">
                <h2><span class="icon">💾</span> 存档数据测试</h2>
                <button class="btn" onclick="testLocalStorage()">检查存档</button>
                <button class="btn btn-warning" onclick="showPlayerData()">显示玩家数据</button>
                <button class="btn btn-danger" onclick="clearPlayerData()">清除存档</button>
                <div class="result-area" id="lsResult">点击按钮检查存档数据...</div>
            </div>

            <!-- 游戏资源测试 -->
            <div class="test-card">
                <h2><span class="icon">📦</span> 游戏资源测试</h2>
                <button class="btn" onclick="testAssets()">检查资源文件</button>
                <button class="btn" onclick="testJSModules()">检查脚本文件</button>
                <button class="btn" onclick="testCSSFiles()">检查样式文件</button>
                <div class="result-area" id="assetsResult">点击按钮检查资源文件...</div>
            </div>

            <!-- 游戏功能测试 -->
            <div class="test-card">
                <h2><span class="icon">🎮</span> 游戏功能测试</h2>
                <button class="btn" onclick="testGameFunctions()">检查游戏函数</button>
                <button class="btn" onclick="testWeaponSystem()">武器系统</button>
                <button class="btn" onclick="testLotterySystem()">抽奖系统</button>
                <div class="result-area" id="funcResult">点击按钮检查游戏功能...</div>
            </div>

            <!-- 性能测试 -->
            <div class="test-card">
                <h2><span class="icon">⚡</span> 性能测试</h2>
                <button class="btn" onclick="testPerformance()">运行性能测试</button>
                <button class="btn" onclick="testMemory()">内存使用</button>
                <div class="result-area" id="perfResult">点击按钮运行性能测试...</div>
            </div>

            <!-- 测试日志 -->
            <div class="test-card">
                <h2><span class="icon">📋</span> 测试日志</h2>
                <button class="btn" onclick="clearLog()">清除日志</button>
                <button class="btn btn-success" onclick="exportLog()">导出日志</button>
                <div class="result-area" id="logResult" style="min-height: 120px;">测试日志将显示在这里...</div>
            </div>
        </div>
    </div>

    <script>
        // ========== 全局日志函数 ==========
        let testLogs = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            // 日志前缀中文化：通过/失败/信息/警告
            const prefix = { pass: '[通过]', fail: '[失败]', info: '[信息]', warn: '[警告]' }[type] || '[信息]';
            const colored = { pass: 'status-pass', fail: 'status-fail', info: 'status-info', warn: 'status-warn' }[type] || 'status-info';
            const line = `<span class="${colored}">${timestamp} ${prefix} ${message}</span>`;
            testLogs.push({ time: timestamp, type, message });
            const logArea = document.getElementById('logResult');
            logArea.innerHTML = testLogs.map(l => {
                const c = { pass: 'status-pass', fail: 'status-fail', info: 'status-info', warn: 'status-warn' }[l.type] || 'status-info';
                const p = { pass: '[通过]', fail: '[失败]', info: '[信息]', warn: '[警告]' }[l.type] || '[信息]';
                return `<span class="${c}">${l.time} ${p} ${l.message}</span>`;
            }).join('\n');
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLog() {
            testLogs = [];
            document.getElementById('logResult').innerHTML = '日志已清除';
        }

        function exportLog() {
            const text = testLogs.map(l => `${l.time} [${ {pass:'通过',fail:'失败',info:'信息',warn:'警告'}[l.type] || '信息' }] ${l.message}`).join('\n');
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '测试日志-' + Date.now() + '.txt';
            a.click();
            log('日志已导出', 'pass');
        }

        // ========== 初始化信息 ==========
        function initInfo() {
            document.getElementById('testTime').textContent = new Date().toLocaleString();
            document.getElementById('browserInfo').textContent = navigator.userAgent;
            document.getElementById('screenInfo').textContent = `${screen.width} × ${screen.height}`;
            try {
                localStorage.setItem('__测试__', '1');
                localStorage.removeItem('__测试__');
                document.getElementById('lsStatus').textContent = '可用 ✓';
                document.getElementById('lsStatus').className = 'status-pass';
                log('本地存储可用', 'pass');
            } catch (e) {
                document.getElementById('lsStatus').textContent = '不可用 ✗';
                document.getElementById('lsStatus').className = 'status-fail';
                log('本地存储不可用：' + e.message, 'fail');
            }
        }

        // ========== 服务器连通性测试 ==========
        async function testServer(port) {
            log(`正在测试服务器 ${port}...`, 'info');
            const result = document.getElementById('serverResult');
            try {
                const start = performance.now();
                const response = await fetch(`http://localhost:${port}/`, {
                    mode: 'cors',
                    cache: 'no-cache'
                });
                const elapsed = (performance.now() - start).toFixed(2);
                if (response.ok) {
                    log(`服务器 ${port} 连通（${elapsed}毫秒，状态码 ${response.status}）`, 'pass');
                    result.innerHTML = `<span class="status-pass">✓ 端口 ${port} 正常（状态码 ${response.status}，耗时 ${elapsed} 毫秒）</span>`;
                } else {
                    log(`服务器 ${port} 返回状态码 ${response.status}`, 'warn');
                    result.innerHTML = `<span class="status-warn">⚠ 端口 ${port} 返回 ${response.status}</span>`;
                }
            } catch (e) {
                log(`服务器 ${port} 连接失败：${e.message}`, 'fail');
                result.innerHTML = `<span class="status-fail">✗ 端口 ${port} 不可达：${e.message}</span>`;
            }
        }

        async function testAllServers() {
            document.getElementById('serverResult').innerHTML = '正在测试所有服务器...';
            await testServer(8080);
            await testServer(3030);
        }

        // ========== 存档数据测试 ==========
        function testLocalStorage() {
            const result = document.getElementById('lsResult');
            const keys = Object.keys(localStorage).filter(k => k.startsWith('deathTrench_'));
            if (keys.length === 0) {
                log('未找到游戏存档', 'warn');
                result.innerHTML = '<span class="status-warn">未找到 deathTrench_ 开头的存档数据</span>';
                return;
            }
            log(`找到 ${keys.length} 个存档键`, 'pass');
            let html = `<span class="status-pass">找到 ${keys.length} 个存档键：</span>\n`;
            keys.forEach(k => {
                const v = localStorage.getItem(k);
                const size = v ? v.length : 0;
                html += `<span class="status-info">${k}</span>（${size} 字节）\n`;
            });
            result.innerHTML = html;
        }

        function showPlayerData() {
            const result = document.getElementById('lsResult');
            const data = localStorage.getItem('deathTrench_playerData');
            if (!data) {
                log('未找到玩家数据', 'warn');
                result.innerHTML = '<span class="status-warn">未找到 deathTrench_playerData</span>';
                return;
            }
            try {
                const parsed = JSON.parse(data);
                log('玩家数据已显示', 'pass');
                result.innerHTML = '<span class="status-pass">玩家数据：</span>\n' +
                    '<span class="status-info">' + JSON.stringify(parsed, null, 2).substring(0, 500) + '</span>';
            } catch (e) {
                log('玩家数据解析失败：' + e.message, 'fail');
                result.innerHTML = '<span class="status-fail">解析失败：' + e.message + '</span>';
            }
        }

        function clearPlayerData() {
            if (!confirm('确定要清除所有游戏存档吗？此操作不可恢复！')) return;
            const keys = Object.keys(localStorage).filter(k => k.startsWith('deathTrench_'));
            keys.forEach(k => localStorage.removeItem(k));
            log(`已清除 ${keys.length} 个存档`, 'pass');
            document.getElementById('lsResult').innerHTML = `<span class="status-pass">已清除 ${keys.length} 个存档</span>`;
        }

        // ========== 游戏资源测试 ==========
        async function testAssets() {
            const result = document.getElementById('assetsResult');
            result.innerHTML = '正在检查资源文件...';
            const assets = [
                '/css/style.css',
                '/css/style-new-ui.css',
                '/css/style-new-ui-panels.css',
                '/js/game.js',
                '/js/save.js',
                '/js/utils.js',
                '/js/coord.js',
                '/api.js'
            ];
            let pass = 0, fail = 0;
            let html = '';
            for (const asset of assets) {
                try {
                    const response = await fetch(asset, { cache: 'no-cache' });
                    if (response.ok) {
                        html += `<span class="status-pass">✓ ${asset}</span>\n`;
                        pass++;
                    } else {
                        html += `<span class="status-fail">✗ ${asset}（状态码 ${response.status}）</span>\n`;
                        fail++;
                    }
                } catch (e) {
                    html += `<span class="status-fail">✗ ${asset}（${e.message}）</span>\n`;
                    fail++;
                }
            }
            log(`资源检查：${pass} 个通过，${fail} 个失败`, pass > 0 && fail === 0 ? 'pass' : 'warn');
            result.innerHTML = html + `<span class="status-info">总计：${pass} 个通过，${fail} 个失败</span>`;
        }

        async function testJSModules() {
            const result = document.getElementById('assetsResult');
            result.innerHTML = '正在检查脚本文件...';
            const modules = ['/js/game.js', '/js/save.js', '/js/utils.js', '/js/coord.js', '/api.js'];
            let html = '';
            for (const mod of modules) {
                try {
                    const response = await fetch(mod, { cache: 'no-cache' });
                    if (response.ok) {
                        const text = await response.text();
                        const size = (text.length / 1024).toFixed(2);
                        html += `<span class="status-pass">✓ ${mod}</span>（${size} KB）\n`;
                    } else {
                        html += `<span class="status-fail">✗ ${mod}</span>\n`;
                    }
                } catch (e) {
                    html += `<span class="status-fail">✗ ${mod}</span>\n`;
                }
            }
            result.innerHTML = html;
            log('脚本文件检查完成', 'pass');
        }

        async function testCSSFiles() {
            const result = document.getElementById('assetsResult');
            const cssFiles = ['/css/style.css', '/css/style-new-ui.css', '/css/style-new-ui-panels.css'];
            let html = '';
            for (const css of cssFiles) {
                try {
                    const response = await fetch(css, { cache: 'no-cache' });
                    if (response.ok) {
                        html += `<span class="status-pass">✓ ${css}</span>\n`;
                    } else {
                        html += `<span class="status-fail">✗ ${css}</span>\n`;
                    }
                } catch (e) {
                    html += `<span class="status-fail">✗ ${css}</span>\n`;
                }
            }
            result.innerHTML = html;
            log('样式文件检查完成', 'pass');
        }

        // ========== 游戏功能测试 ==========
        function testGameFunctions() {
            const result = document.getElementById('funcResult');
            const functions = [
                'initGame', 'startGame', 'saveGame', 'loadGame',
                'showLobby', 'showMainMenu', 'showInventory',
                'showMarket', 'showBattleSetup', 'showLottery'
            ];
            let html = '';
            let pass = 0;
            functions.forEach(fn => {
                if (typeof window[fn] === 'function') {
                    html += `<span class="status-pass">✓ ${fn}()</span>\n`;
                    pass++;
                } else {
                    html += `<span class="status-fail">✗ ${fn}() 未定义</span>\n`;
                }
            });
            log(`游戏函数检查：${pass}/${functions.length} 个可用`, pass === functions.length ? 'pass' : 'warn');
            result.innerHTML = html;
        }

        function testWeaponSystem() {
            const result = document.getElementById('funcResult');
            try {
                if (typeof WEAPONS === 'undefined') {
                    result.innerHTML = '<span class="status-fail">WEAPONS 未定义（需要在游戏页面测试）</span>';
                    log('WEAPONS 未定义', 'warn');
                    return;
                }
                const unlocked = WEAPONS.filter(w => w.unlocked).length;
                result.innerHTML = `<span class="status-pass">武器系统正常</span>\n` +
                    `<span class="status-info">总数：${WEAPONS.length}</span>\n` +
                    `<span class="status-info">已解锁：${unlocked}</span>`;
                log(`武器系统：${WEAPONS.length} 个武器，${unlocked} 个已解锁`, 'pass');
            } catch (e) {
                result.innerHTML = '<span class="status-warn">需要在游戏页面测试武器系统</span>';
                log('武器系统测试需要游戏环境', 'warn');
            }
        }

        function testLotterySystem() {
            const result = document.getElementById('funcResult');
            try {
                if (typeof LOTTERY === 'undefined') {
                    result.innerHTML = '<span class="status-fail">LOTTERY 未定义（需要在游戏页面测试）</span>';
                    log('LOTTERY 未定义', 'warn');
                    return;
                }
                const pools = LOTTERY.pools || [];
                result.innerHTML = `<span class="status-pass">抽奖系统正常</span>\n` +
                    `<span class="status-info">奖池物品数：${pools.length}</span>`;
                log(`抽奖系统：${pools.length} 个奖池物品`, 'pass');
            } catch (e) {
                result.innerHTML = '<span class="status-warn">需要在游戏页面测试抽奖系统</span>';
                log('抽奖系统测试需要游戏环境', 'warn');
            }
        }

        // ========== 性能测试 ==========
        function testPerformance() {
            const result = document.getElementById('perfResult');
            result.innerHTML = '正在运行性能测试...';
            const start = performance.now();
            let sum = 0;
            for (let i = 0; i < 1000000; i++) {
                sum += Math.sqrt(i);
            }
            const elapsed = (performance.now() - start).toFixed(2);
            result.innerHTML = `<span class="status-pass">性能测试完成</span>\n` +
                `<span class="status-info">100万次平方根计算：${elapsed} 毫秒</span>\n` +
                `<span class="status-info">结果校验：${sum.toFixed(2)}</span>`;
            log(`性能测试：${elapsed} 毫秒`, 'pass');
        }

        function testMemory() {
            const result = document.getElementById('perfResult');
            if (performance.memory) {
                const mem = performance.memory;
                const used = (mem.usedJSHeapSize / 1024 / 1024).toFixed(2);
                const total = (mem.totalJSHeapSize / 1024 / 1024).toFixed(2);
                const limit = (mem.jsHeapSizeLimit / 1024 / 1024).toFixed(2);
                result.innerHTML = `<span class="status-pass">内存信息（仅 Chrome 内核）</span>\n` +
                    `<span class="status-info">已用：${used} MB</span>\n` +
                    `<span class="status-info">总计：${total} MB</span>\n` +
                    `<span class="status-info">上限：${limit} MB</span>`;
                log(`内存使用：${used} MB / ${limit} MB`, 'pass');
            } else {
                result.innerHTML = '<span class="status-warn">当前浏览器不支持内存查询接口</span>';
                log('内存接口不可用', 'warn');
            }
        }

        // ========== 启动 ==========
        window.addEventListener('DOMContentLoaded', () => {
            initInfo();
            log('测试页面已加载', 'pass');
        });
    </script>
</body>
</html>
