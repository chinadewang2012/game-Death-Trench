<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Death Trench 游戏合集</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a2332, #0a0e14);
      color: #e0e6ed; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 32px; padding: 40px;
    }
    h1 { font-size: 32px; letter-spacing: 4px; color: #00cc66; text-shadow: 0 0 20px rgba(0,204,102,.4); }
    .sub { color: #8a96a3; font-size: 14px; }
    .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .card {
      width: 260px; background: #141b26; border: 1px solid #283340; border-radius: 12px;
      padding: 28px 22px; text-decoration: none; color: inherit; transition: .2s;
    }
    .card:hover { border-color: #00cc66; transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,204,102,.15); }
    .card .ico { font-size: 40px; margin-bottom: 12px; }
    .card .nm { font-size: 19px; font-weight: 600; margin-bottom: 8px; color: #fff; }
    .card .ds { font-size: 13px; color: #8a96a3; line-height: 1.5; }
    .card .tag { display: inline-block; margin-top: 14px; font-size: 12px; color: #00cc66;
      border: 1px solid #00cc66; border-radius: 20px; padding: 3px 12px; }
    footer { color: #5a6573; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>DEATH TRENCH</h1>
  <div class="sub">两个独立游戏 · 各自运行</div>
  <div class="cards">
    <a class="card" href="death-trench-2d/index.html">
      <div class="ico">🪖</div>
      <div class="nm">Death Trench 2D（原版）</div>
      <div class="ds">经典 2D 俯视角射击，含搜打撤/生存等模式、商店与配装。</div>
      <div class="tag">原版 · 完整内容</div>
    </a>
    <a class="card" href="death-trench-expanded/index.html">
      <div class="ico">💀</div>
      <div class="nm">Death Trench Expanded（扩充版）</div>
      <div class="ds">数据驱动重构，192+ 武器/配件/物品/敌人，搜打撤含搜刮与撤离。</div>
      <div class="tag">新版 · 内容扩充</div>
    </a>
  </div>
  <footer>运行游戏请各自进入文件夹执行 <code>npm start</code>，默认端口 8080</footer>
</body>
</html>
