name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 原游戏位于仓库的 death-trench-2d 子目录
          path: 'death-trench-2d'

      - name: Deploy to GitHub Pages
        id: deployment
        environment:
          name: github-pages
        uses: actions/deploy-pages@v4
