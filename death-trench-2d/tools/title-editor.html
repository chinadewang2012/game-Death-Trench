<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>称号编辑器 - Death Trench 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 20px; color: #ffaa00; }
        .header-actions { display: flex; gap: 10px; }
        .btn {
            padding: 8px 16px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
        }
        .btn:hover { background: #30363d; border-color: #58a6ff; }
        .btn-primary { background: #ffaa00; color: #0d1117; font-weight: 600; }
        .btn-primary:hover { background: #ff8800; }
        .btn-danger { border-color: #f85149; color: #f85149; }
        .btn-danger:hover { background: rgba(248, 81, 73, 0.15); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: calc(100vh - 60px);
        }
        .sidebar {
            background: #161b22;
            border-right: 1px solid #30363d;
            padding: 16px;
            overflow-y: auto;
        }
        .sidebar-section { margin-bottom: 18px; }
        .sidebar-title {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #21262d;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .title-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 6px;
            background: #0d1117;
            border: 1px solid #21262d;
            transition: all 0.15s;
        }
        .title-item:hover { background: #1c2128; border-color: #30363d; }
        .title-item.active {
            background: rgba(255, 170, 0, 0.1);
            border-color: #ffaa00;
        }
        .title-item-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .title-item-desc {
            font-size: 11px;
            color: #6e7681;
        }
        .title-item-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-top: 6px;
        }
        .order-btns {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .editor {
            padding: 24px;
            overflow-y: auto;
        }
        .editor-header {
            font-size: 16px;
            color: #ffaa00;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #30363d;
        }
        .form-section {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 16px;
        }
        .form-title {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #21262d;
            letter-spacing: 1px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 160px 1fr;
            align-items: center;
            margin-bottom: 14px;
            gap: 14px;
        }
        .form-label {
            font-size: 13px;
            color: #c9d1d9;
        }
        .form-input, .form-select {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 12px;
            color: #e6edf3;
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s;
            width: 100%;
            font-family: inherit;
        }
        .form-input:focus, .form-select:focus { border-color: #58a6ff; }
        .color-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .color-input {
            width: 40px;
            height: 34px;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
            background: #0d1117;
            padding: 2px;
        }
        .color-preview {
            flex: 1;
            background: #0d1117;
            border: 1px dashed #30363d;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 11px;
            color: #8b949e;
            font-family: monospace;
        }
        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .pattern-option {
            padding: 10px;
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
            transition: all 0.15s;
        }
        .pattern-option:hover { border-color: #58a6ff; }
        .pattern-option.active {
            border-color: #ffaa00;
            background: rgba(255, 170, 0, 0.08);
        }
        .pattern-icon {
            font-size: 22px;
            display: block;
            margin-bottom: 4px;
        }

        /* 花纹预览（各种 pattern 的 CSS 效果） */
        .demo-preview {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 16px;
            text-align: center;
        }
        .demo-label {
            font-size: 11px;
            color: #6e7681;
            margin-bottom: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .demo-badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid transparent;
        }
        .demo-badge.pattern-stripes {
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0 4px, transparent 4px 10px);
        }
        .demo-badge.pattern-dots {
            background-image: radial-gradient(circle, rgba(255,255,255,0.2) 1px, transparent 1.5px);
            background-size: 8px 8px;
        }
        .demo-badge.pattern-glow {
            box-shadow: 0 0 12px currentColor, 0 0 20px currentColor;
        }
        .demo-badge.pattern-shimmer {
            background: linear-gradient(90deg, var(--grad-start), var(--grad-end));
            animation: shimmer 2.5s infinite;
        }
        .demo-badge.pattern-border {
            border: 2px solid var(--border-color);
            box-shadow: inset 0 0 8px rgba(255,255,255,0.15);
        }
        @keyframes shimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .json-preview {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 14px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            color: #00ff88;
            max-height: 200px;
            overflow: auto;
            white-space: pre;
        }

        .condition-grid {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 12px;
            align-items: center;
        }

        @media (max-width: 800px) {
            .main-content { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏅 称号编辑器</h1>
        <div class="header-actions">
            <button class="btn" onclick="resetDefaults()">恢复默认</button>
            <button class="btn" onclick="copyJSON()">复制 JSON</button>
            <button class="btn" onclick="exportJSON()">导出</button>
            <button class="btn" onclick="document.getElementById('importFile').click()">导入</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
            <button class="btn btn-primary" onclick="saveAndApply()">保存并应用</button>
            <a href="index.html" class="btn">← 返回</a>
        </div>
    </div>

    <div class="main-content">
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">称号列表</div>
                <button class="btn btn-sm" style="width:100%;margin-bottom:10px" onclick="addTitle()">+ 新增称号</button>
                <div id="titleList"></div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">使用说明</div>
                <div style="font-size:11px;line-height:1.7;color:#6e7681">
                    1. 点击左侧称号进行编辑<br>
                    2. 可自定义名称、图标、颜色<br>
                    3. 选择花纹样式美化徽章<br>
                    4. 设置获得条件（击杀/得分/时长/KD）<br>
                    5. 点击「保存并应用」写入存档
                </div>
            </div>
        </div>

        <div class="editor">
            <div id="editorContent">
                <div class="demo-preview">
                    <div class="demo-label">实时预览</div>
                    <span class="demo-badge" id="demoBadge">新兵</span>
                </div>

                <div class="form-section">
                    <div class="form-title">基本信息</div>
                    <div class="form-row">
                        <label class="form-label">称号名称</label>
                        <input type="text" class="form-input" id="f-name" maxlength="16" placeholder="如：传奇战神">
                    </div>
                    <div class="form-row">
                        <label class="form-label">图标 (Emoji)</label>
                        <input type="text" class="form-input" id="f-icon" maxlength="4" placeholder="🏅">
                    </div>
                    <div class="form-row">
                        <label class="form-label">文字颜色</label>
                        <div class="color-row">
                            <input type="color" class="color-input" id="f-color" value="#ffffff">
                            <input type="text" class="form-input" id="f-colorText" style="max-width:150px;font-family:monospace">
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="form-label">背景起始色</label>
                        <div class="color-row">
                            <input type="color" class="color-input" id="f-bg1" value="#ffaa00">
                            <input type="text" class="form-input" id="f-bg1Text" style="max-width:150px;font-family:monospace">
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="form-label">背景结束色</label>
                        <div class="color-row">
                            <input type="color" class="color-input" id="f-bg2" value="#ff6600">
                            <input type="text" class="form-input" id="f-bg2Text" style="max-width:150px;font-family:monospace">
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="form-label">边框颜色</label>
                        <div class="color-row">
                            <input type="color" class="color-input" id="f-border" value="#ffffff">
                            <input type="text" class="form-input" id="f-borderText" style="max-width:150px;font-family:monospace">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-title">花纹样式</div>
                    <div class="pattern-grid" id="patternGrid">
                        <div class="pattern-option" data-pattern="none">
                            <span class="pattern-icon">🔲</span>纯色
                        </div>
                        <div class="pattern-option" data-pattern="gradient">
                            <span class="pattern-icon">🌈</span>渐变
                        </div>
                        <div class="pattern-option" data-pattern="stripes">
                            <span class="pattern-icon">📐</span>斜纹
                        </div>
                        <div class="pattern-option" data-pattern="dots">
                            <span class="pattern-icon">✨</span>点阵
                        </div>
                        <div class="pattern-option" data-pattern="glow">
                            <span class="pattern-icon">💡</span>光晕
                        </div>
                        <div class="pattern-option" data-pattern="shimmer">
                            <span class="pattern-icon">⭐</span>闪烁
                        </div>
                        <div class="pattern-option" data-pattern="border">
                            <span class="pattern-icon">🔷</span>亮边
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-title">获得条件</div>
                    <div class="form-row">
                        <label class="form-label">条件类型</label>
                        <select class="form-select" id="f-conditionType">
                            <option value="default">初始拥有</option>
                            <option value="kills">累计击杀数 ≥</option>
                            <option value="score">累计得分 ≥</option>
                            <option value="missions">完成任务数 ≥</option>
                            <option value="playtime">游玩时长（秒）≥</option>
                            <option value="kd">K/D 比 ≥</option>
                            <option value="coins">金币 ≥</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label class="form-label">阈值数值</label>
                        <input type="number" class="form-input" id="f-threshold" min="0" step="1" placeholder="如：50">
                    </div>
                    <div class="form-row">
                        <label class="form-label">条件描述</label>
                        <input type="text" class="form-input" id="f-reqText" maxlength="30" placeholder="如：击杀50人">
                    </div>
                </div>

                <div style="display:flex;gap:10px;margin-bottom:20px">
                    <button class="btn btn-primary" onclick="saveCurrent()">保存当前称号</button>
                    <button class="btn btn-danger" onclick="deleteCurrent()">删除此称号</button>
                    <button class="btn" onclick="moveUp()">↑ 上移</button>
                    <button class="btn" onclick="moveDown()">↓ 下移</button>
                </div>

                <div class="form-section">
                    <div class="form-title">当前配置 JSON 预览</div>
                    <div class="json-preview" id="jsonPreview">{}</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_TITLES = [
            { id: 't0', name: '新兵', icon: '🎖️', color: '#ffffff', bg1: 'rgba(139,148,158,0.5)', bg2: 'rgba(139,148,158,0.3)', borderColor: '#8b949e', pattern: 'none', conditionType: 'default', threshold: 0, reqText: '初始' },
            { id: 't1', name: '士兵', icon: '⚔️', color: '#ffffff', bg1: '#58a6ff', bg2: '#1f6feb', borderColor: '#58a6ff', pattern: 'gradient', conditionType: 'kills', threshold: 10, reqText: '击杀10人' },
            { id: 't2', name: '精英', icon: '🎯', color: '#ffffff', bg1: '#00cc66', bg2: '#00aa55', borderColor: '#00ff88', pattern: 'glow', conditionType: 'kills', threshold: 50, reqText: '击杀50人' },
            { id: 't3', name: '老兵', icon: '🔥', color: '#ffffff', bg1: '#ff6b6b', bg2: '#c92a2a', borderColor: '#ff6b6b', pattern: 'border', conditionType: 'kills', threshold: 100, reqText: '击杀100人' },
            { id: 't4', name: '战场之王', icon: '👑', color: '#ffeb85', bg1: '#ff8800', bg2: '#c92a2a', borderColor: '#ffaa00', pattern: 'shimmer', conditionType: 'kills', threshold: 200, reqText: '击杀200人' },
            { id: 't5', name: '传奇战神', icon: '💎', color: '#ffffff', bg1: '#d946ef', bg2: '#7c3aed', borderColor: '#d946ef', pattern: 'glow', conditionType: 'kills', threshold: 500, reqText: '击杀500人' }
        ];

        let titles = [];
        let currentIndex = 0;

        function loadTitles() {
            try {
                const raw = localStorage.getItem('deathTrench_titles');
                if (raw) titles = JSON.parse(raw);
                else titles = JSON.parse(JSON.stringify(DEFAULT_TITLES));
            } catch (e) {
                titles = JSON.parse(JSON.stringify(DEFAULT_TITLES));
            }
        }

        function renderList() {
            const el = document.getElementById('titleList');
            el.innerHTML = '';
            titles.forEach(function(t, i) {
                const div = document.createElement('div');
                div.className = 'title-item' + (i === currentIndex ? ' active' : '');
                div.onclick = function() { currentIndex = i; renderAll(); };
                div.innerHTML = '<div class="title-item-name">' + t.icon + ' ' + t.name + '</div>'
                    + '<div class="title-item-desc">' + t.reqText + '</div>'
                    + '<span class="title-item-badge" style="' + buildBadgeStyle(t) + '">' + t.name + '</span>';
                el.appendChild(div);
            });
        }

        function buildBadgeStyle(t) {
            let bg = '';
            if (t.pattern === 'gradient' || t.pattern === 'shimmer') {
                bg = 'linear-gradient(135deg, ' + t.bg1 + ', ' + t.bg2 + ')';
            } else if (t.pattern === 'stripes') {
                bg = 'linear-gradient(135deg, ' + t.bg1 + ', ' + t.bg2 + '), repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0 4px, transparent 4px 10px)';
                bg = 'linear-gradient(135deg, ' + t.bg1 + ', ' + t.bg2 + ')';
            } else if (t.pattern === 'dots') {
                bg = 'radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1.5px), linear-gradient(135deg, ' + t.bg1 + ', ' + t.bg2 + ')';
            } else {
                bg = 'linear-gradient(135deg, ' + t.bg1 + ', ' + t.bg2 + ')';
            }
            let style = 'background:' + bg + ';color:' + t.color + ';border:1px solid ' + t.borderColor + ';';
            if (t.pattern === 'glow') style += 'box-shadow:0 0 10px ' + t.borderColor + ',0 0 18px ' + t.color + ';';
            if (t.pattern === 'shimmer') style += 'animation:shimmer 2.5s infinite;';
            if (t.pattern === 'border') style += 'border:2px solid ' + t.borderColor + ';box-shadow:inset 0 0 8px rgba(255,255,255,0.15);';
            if (t.pattern === 'stripes') style += 'background-image:repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0 4px, transparent 4px 10px),linear-gradient(135deg,' + t.bg1 + ',' + t.bg2 + ');';
            if (t.pattern === 'dots') style += 'background-image:radial-gradient(circle,rgba(255,255,255,0.15) 1px,transparent 1.5px),linear-gradient(135deg,' + t.bg1 + ',' + t.bg2 + ');background-size:8px 8px,cover;';
            return style;
        }

        function renderEditor() {
            const t = titles[currentIndex];
            if (!t) return;
            document.getElementById('f-name').value = t.name;
            document.getElementById('f-icon').value = t.icon;
            document.getElementById('f-color').value = normalizeColor(t.color);
            document.getElementById('f-colorText').value = t.color;
            document.getElementById('f-bg1').value = normalizeColor(t.bg1);
            document.getElementById('f-bg1Text').value = t.bg1;
            document.getElementById('f-bg2').value = normalizeColor(t.bg2);
            document.getElementById('f-bg2Text').value = t.bg2;
            document.getElementById('f-border').value = normalizeColor(t.borderColor);
            document.getElementById('f-borderText').value = t.borderColor;
            document.getElementById('f-conditionType').value = t.conditionType;
            document.getElementById('f-threshold').value = t.threshold;
            document.getElementById('f-reqText').value = t.reqText;

            document.querySelectorAll('.pattern-option').forEach(function(el) {
                el.classList.toggle('active', el.dataset.pattern === t.pattern);
            });
            updateDemo();
            renderJSON();
        }

        function normalizeColor(c) {
            if (!c) return '#ffffff';
            if (c.startsWith('#')) {
                if (c.length === 7) return c;
                return '#ffffff';
            }
            // 处理 rgba/rgb
            const m = c.match(/\d+/g);
            if (m && m.length >= 3) {
                const r = parseInt(m[0]).toString(16).padStart(2, '0');
                const g = parseInt(m[1]).toString(16).padStart(2, '0');
                const b = parseInt(m[2]).toString(16).padStart(2, '0');
                return '#' + r + g + b;
            }
            return '#ffffff';
        }

        function updateDemo() {
            const t = readForm();
            const badge = document.getElementById('demoBadge');
            badge.textContent = t.icon + ' ' + t.name;
            badge.style.cssText = 'padding:8px 18px;border-radius:10px;font-size:15px;font-weight:600;' + buildBadgeStyle(t);
        }

        function readForm() {
            return {
                id: (titles[currentIndex] && titles[currentIndex].id) || 't' + Date.now(),
                name: document.getElementById('f-name').value || '未命名',
                icon: document.getElementById('f-icon').value || '🏅',
                color: document.getElementById('f-colorText').value || '#ffffff',
                bg1: document.getElementById('f-bg1Text').value || '#ffaa00',
                bg2: document.getElementById('f-bg2Text').value || '#ff6600',
                borderColor: document.getElementById('f-borderText').value || '#ffffff',
                pattern: document.querySelector('.pattern-option.active')?.dataset.pattern || 'none',
                conditionType: document.getElementById('f-conditionType').value,
                threshold: parseInt(document.getElementById('f-threshold').value) || 0,
                reqText: document.getElementById('f-reqText').value || '自定义'
            };
        }

        function renderJSON() {
            document.getElementById('jsonPreview').textContent = JSON.stringify(titles, null, 2);
        }

        function renderAll() { renderList(); renderEditor(); }

        function saveCurrent() { titles[currentIndex] = readForm(); showToast('已保存当前称号'); renderAll(); }
        function deleteCurrent() {
            if (titles.length <= 1) { showToast('至少保留一个称号'); return; }
            if (!confirm('删除「' + titles[currentIndex].name + '」？')) return;
            titles.splice(currentIndex, 1);
            currentIndex = Math.max(0, currentIndex - 1);
            renderAll();
        }
        function addTitle() {
            const newT = { id: 't' + Date.now(), name: '新称号', icon: '🏅', color: '#ffffff', bg1: '#ffaa00', bg2: '#ff6600', borderColor: '#ffaa00', pattern: 'gradient', conditionType: 'kills', threshold: 100, reqText: '自定义' };
            titles.push(newT);
            currentIndex = titles.length - 1;
            renderAll();
        }
        function moveUp() {
            if (currentIndex <= 0) return;
            [titles[currentIndex - 1], titles[currentIndex]] = [titles[currentIndex], titles[currentIndex - 1]];
            currentIndex--;
            renderAll();
        }
        function moveDown() {
            if (currentIndex >= titles.length - 1) return;
            [titles[currentIndex + 1], titles[currentIndex]] = [titles[currentIndex], titles[currentIndex + 1]];
            currentIndex++;
            renderAll();
        }
        function resetDefaults() {
            if (!confirm('恢复为默认6个称号？当前配置会被覆盖')) return;
            titles = JSON.parse(JSON.stringify(DEFAULT_TITLES));
            currentIndex = 0;
            renderAll();
        }
        function saveAndApply() {
            localStorage.setItem('deathTrench_titles', JSON.stringify(titles));
            showToast('✓ 已保存到存档，重启游戏后生效');
        }
        function copyJSON() {
            const text = JSON.stringify(titles, null, 2);
            navigator.clipboard.writeText(text).then(function() { showToast('JSON 已复制'); });
        }
        function exportJSON() {
            const blob = new Blob([JSON.stringify(titles, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'death-trench-titles.json';
            a.click();
        }
        function importJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (Array.isArray(data) && data.length > 0) {
                        titles = data;
                        currentIndex = 0;
                        renderAll();
                        showToast('导入成功，记得点击「保存并应用」');
                    } else {
                        alert('格式错误：需要一个非空数组');
                    }
                } catch (err) { alert('解析失败：' + err.message); }
            };
            reader.readAsText(file);
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.textContent = msg;
            t.style.cssText = 'position:fixed;top:20px;right:20px;background:rgba(0,255,136,0.15);color:#00ff88;padding:10px 18px;border-radius:8px;border:1px solid rgba(0,255,136,0.3);z-index:9999;font-size:13px;backdrop-filter:blur(6px);';
            document.body.appendChild(t);
            setTimeout(function() { t.remove(); }, 2000);
        }

        // 绑定事件
        ['f-name', 'f-icon', 'f-colorText', 'f-bg1Text', 'f-bg2Text', 'f-borderText', 'f-threshold', 'f-reqText'].forEach(function(id) {
            document.getElementById(id).addEventListener('input', updateDemo);
        });
        document.getElementById('f-color').addEventListener('input', function(e) {
            document.getElementById('f-colorText').value = e.target.value;
            updateDemo();
        });
        document.getElementById('f-bg1').addEventListener('input', function(e) {
            document.getElementById('f-bg1Text').value = e.target.value;
            updateDemo();
        });
        document.getElementById('f-bg2').addEventListener('input', function(e) {
            document.getElementById('f-bg2Text').value = e.target.value;
            updateDemo();
        });
        document.getElementById('f-border').addEventListener('input', function(e) {
            document.getElementById('f-borderText').value = e.target.value;
            updateDemo();
        });
        document.getElementById('f-conditionType').addEventListener('change', updateDemo);
        document.querySelectorAll('.pattern-option').forEach(function(el) {
            el.addEventListener('click', function() {
                document.querySelectorAll('.pattern-option').forEach(function(p) { p.classList.remove('active'); });
                el.classList.add('active');
                updateDemo();
            });
        });

        // 初始化
        loadTitles();
        renderAll();
    </script>
</body>
</html>
